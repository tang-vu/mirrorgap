<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MirrorGap — RWA Integrity Observatory</title>
    <meta
      name="description"
      content="Is tokenized reality still matching reality? MirrorGap watches tokenized real-world assets against their reference observations."
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/desk.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M3 5h10v22H3zM19 5h10v22H19zM13 12h6m-6 8h6' fill='none' stroke='%23b94124' stroke-width='2.5'/></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/overview">
        <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
          <path d="M3 5h10v22H3zM19 5h10v22H19z" fill="none" stroke="currentColor" stroke-width="2.5" />
          <path d="M13 12h6m-6 8h6" stroke="currentColor" stroke-width="2.5" />
        </svg>
        <div>
          <h1>MirrorGap</h1>
          <p class="tagline">TOKENIZED ASSETS / OBSERVABLE TRUTH</p>
        </div>
      </a>
      <div class="topbar-right">
        <span id="mode-badge" class="badge badge-mode" title="Data source mode">…</span>
        <span id="cap-badge" class="badge badge-cap" title="CMC plan capability">…</span>
        <span id="live-dot" class="live-dot" title="SSE disconnected" role="status"></span>
      </div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button class="tab" data-view="overview">Overview</button>
      <button class="tab" data-view="radar">Integrity Radar</button>
      <button class="tab" data-view="events">Incidents</button>
      <button class="tab" data-view="watchlist">Watchlist</button>
      <button class="tab" data-view="diagnostics">Diagnostics</button>
      <button class="tab" data-view="about">How it works</button>
      <div class="search-box">
        <input
          id="search"
          type="search"
          placeholder="Search assets…   /"
          autocomplete="off"
          aria-label="Search assets"
        />
        <div id="search-results" class="search-results hidden"></div>
      </div>
    </nav>

    <div id="fixture-banner" class="fixture-banner hidden" role="note">
      <strong>DEMO ENVIRONMENT</strong>
      <span>Deterministic synthetic observations. No live market data.</span>
    </div>

    <main id="view" tabindex="-1" aria-live="polite"></main>

    <footer class="footer">
      <span>MirrorGap · CoinMarketCap API Hackathon · Real World Assets track</span>
      <span class="muted">Observe → Detect → Investigate → Prove · deterministic engine</span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
