name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: approve dependency builds
        run: pnpm approve-builds --all || true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm demo:check
      - name: secret scan (tracked files)
        run: |
          ! git grep -nE '(X-CMC_PRO_API_KEY|api_key|apikey|secret|bearer)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{20,}' -- ':!*.md' ':!.env.example'
